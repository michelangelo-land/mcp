name = "michelangelo-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

# Dominio pubblico suggerito (ADR D3: il wrapper resta l'unica origin visibile).
# Abilitare quando la zona DNS è pronta:
# routes = [
#   { pattern = "mcp.michelangelo.land", custom_domain = true }
# ]

# Config non-secret. Il Bearer utente fa passthrough verso l'API — questo
# Worker non ha segreti propri (la validazione JWT usa la JWKS pubblica).
# Il discovery RFC 9728 è self-hosted (/.well-known/oauth-protected-resource,
# same-origin), quindi nessun URL da mantenere al cambio di dominio.
[vars]
# Base URL dell'API pubblica (contratto: michelangelo-api/openapi/v1.yaml).
# Usato sia come target dei tool sia come authorization_server nel discovery.
API_BASE_URL = "https://api.michelangelo.land"
SUPABASE_URL = "https://hwtolnqskgrdgqpacdpi.supabase.co"

[observability.logs]
enabled = false
invocation_logs = true
