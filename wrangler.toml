name = "michelangelo-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-30"
workers_dev = true

# Public domain (ADR D3: the wrapper stays the only visible origin).
# The custom domain is attached in the Cloudflare dashboard; kept here as a
# reference:
# routes = [
#   { pattern = "mcp.michelangelo.land", custom_domain = true }
# ]

# Non-secret config. The user Bearer passes through to the API — this
# worker has no secrets of its own (JWT validation uses the public JWKS).
# RFC 9728 discovery is self-hosted (/.well-known/oauth-protected-resource,
# same-origin), so no URL needs maintaining across domain changes.
[vars]
# Public API base URL (tool backend).
API_BASE_URL = "https://api.michelangelo.land"
# Dedicated auth host (OAuth discovery, authorize, token, JWKS).
# Advertised as the authorization_server in RFC 9728 discovery; the API host
# is only the tool backend.
AUTH_BASE_URL = "https://auth.michelangelo.land"
SUPABASE_URL = "https://hwtolnqskgrdgqpacdpi.supabase.co"

[observability.logs]
enabled = false
invocation_logs = true
